[project]
name = "massivibe"
version = "0.1.0"
description = "Historisation périodique des données OHLCV 1 minute des contrats futures via l'API Massive.com"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TheoBainee" }]
keywords = ["futures", "ohlcv", "massive", "parquet", "polars", "historisation"]

# Dépendances runtime — on privilégie Polars (performant, types Categorical optimisés)
# httpx pour le client HTTP sync, tenacity pour les retries avancés (Retry-After + backoff)
# pydantic-settings pour la config (.env + config.toml), rich pour les logs colorés
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=15",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Dépendances de développement — respx pour mocker httpx dans les tests
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# Point d'entrée CLI : `massivibe <commande>`
massivibe = "massivibe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/massivibe"]

# --- Ruff : linter + formateur ---
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["massivibe"]

# --- MyPy : vérification des types (strict sur src/) ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["massivibe"]

[[tool.mypy.overrides]]
# Polars n'a pas de stubs parfaits — on désactive some checks pour ce module
module = "polars.*"
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["massivibe"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
